[project]
name = "diabetes-classifier"
version = "0.1.0"
description = "A Streamlit diabetes-risk classifier trained on the Pima Indians dataset"
readme = "README.md"
authors = [
    { name = "jrtilak", email = "contact@jrtilak.dev" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.5,<2",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn==1.9.0",
    "streamlit>=1.40,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]

[tool.uv]
package = false
